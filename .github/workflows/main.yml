name: Ruby

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.1', '3.2', '3.3', '3.4']
        include:
          - os: ubuntu-latest
            ruby: '4'
            ta_lib: '0.6.4'
          - os: ubuntu-latest
            ruby: '4'
            ta_lib: '0.8.3'
          - os: windows-latest
            ruby: '4'
            ta_lib: '0.8.3'
          - os: macos-latest
            ruby: '4'

    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }} (TA-Lib ${{ matrix.ta_lib || (matrix.os == 'macos-latest' && 'Homebrew') || '0.6.4' }})

    steps:
    - uses: actions/checkout@v4

    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

    - name: Install TA-Lib on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      env:
        TA_VERSION: ${{ matrix.ta_lib || '0.6.4' }}
      run: |
        wget -O ta-lib.deb "https://github.com/ta-lib/ta-lib/releases/download/v${TA_VERSION}/ta-lib_${TA_VERSION}_amd64.deb"
        sudo dpkg -i ta-lib.deb

    - name: Install TA-Lib on macOS
      if: matrix.os == 'macos-latest'
      run: brew install ta-lib

    - name: Install TA-Lib on Windows
      if: matrix.os == 'windows-latest'
      env:
        TA_VERSION: ${{ matrix.ta_lib || '0.6.4' }}
      run: |
        Invoke-WebRequest -Uri "https://github.com/ta-lib/ta-lib/releases/download/v${env:TA_VERSION}/ta-lib-${env:TA_VERSION}-windows-x86_64.msi" -OutFile "ta-lib.msi"
        $installer = Start-Process msiexec.exe -ArgumentList '/i', 'ta-lib.msi', '/quiet', '/norestart' -Wait -PassThru
        if ($installer.ExitCode -notin 0, 3010) { exit $installer.ExitCode }

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run the default task
      run: bundle exec rake

    - name: Verify generated indicator documentation
      if: runner.os == 'Linux' && matrix.ruby == '4'
      run: |
        bundle exec rake yard
        bundle exec ruby -rta_lib_ffi -e '
          documented = File.read("doc/TALibFFI.html").scan(/id="(\w+)-class_method"/).flatten
          indicators = TALibFFI.group_table.flat_map { |group| TALibFFI.function_table(group) }
          missing = indicators.map(&:downcase) - documented
          stale = documented.reject { |name| TALibFFI.respond_to?(name, true) }
          abort "Missing indicator documentation for #{missing.join(", ")}" unless missing.empty?
          abort "Documented methods unavailable in Ruby: #{stale.join(", ")}" unless stale.empty?
        '
